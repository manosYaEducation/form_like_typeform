<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Secciones | Magallanes Sostenible</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
  <link rel="shortcut icon" href="favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Magallanes Sostenible" />
  <link rel="manifest" href="favicon/site.webmanifest" />
</head>

<body>
  <nav class="navbar">
    <div class="logo">
      <img src="img/logo.png" alt="">
      <h1 id="logo">Magallanes <br><span>Sostenible</span></h1>
    </div>
    <div class="welcome-message">
      <p>Bienvenido usuari@</p>
    </div>
    <div class="menu-icon">&#9776;</div>
  </nav>

  <main class="container">
    <h1>Secciones del Cuestionario</h1>
    <!-- Contenedor donde inyectaremos las categorías -->
    <div class="quiz-list" id="categoriesContainer">
      <!-- Se llena con JS (progress.js) -->
    </div>
  </main>

  <!-- Barra de progreso -->
  <div class="progress-container">
    <div class="progress-text">
      <span>Progreso del cuestionario</span>
      <span class="progress-percent">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>

  <!-- Scripts -->
  <!-- 1. Carga progress.js (renderiza categorías y tarjeta final) -->
  <script src="js/progress.js"></script>
  <script src="js/auth.js"></script>

</body>

</html>
