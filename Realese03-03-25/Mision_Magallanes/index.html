<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Nivel de Circularidad</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <img src="img/logo.png" alt="Logo">
            <h1 id="logo">Magallanes <br><span>Sostenible</span></h1>
        </div>
        <div class="welcome-message">
            <p>Beneficios   Pasos   Testimonios   Nosotros   Blog</p>
        </div>
        <div class="menu-icon">
            &#9776;
        </div>
    </nav>

    <div class="split-container">
        <div class="form-container">
            <p class="titulo">Por favor, ingrese los siguientes datos para enviar la encuesta de nivel de circularidad a la empresa:</p>

            <form action="user_auth.php?action=login" method="post">
              <div class="input-group">
                <label for="nombreEmpresa">Nombre de empresa:</label>
                <input type="text" id="nombreEmpresa" name="nombreEmpresa" required>
              </div>
            
              <div class="input-group">
                <label for="rutEmpresa">RUT de la empresa:</label>
                <input type="text" id="rutEmpresa" name="rutEmpresa" required>
              </div>
            
              <div class="input-group">
                <label for="nombreRepresentante">Nombre del representante:</label>
                <input type="text" id="nombreRepresentante" name="nombreRepresentante" required>
              </div>
            
              <div class="input-group">
                <label for="cargo">Cargo del representante:</label>
                <!-- Importante: name="cargo" -->
                <input type="text" id="cargo" name="cargo" required>
              </div>
            
              <div class="input-group">
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" required>
              </div>
            
              <input type="submit" value="Continuar">
            </form>
        </div>

        <div class="image-section">
            <img src="img/imagen_lateral.jpg" alt="Imagen descriptiva">
        </div>
    </div>

</body>

</html>
