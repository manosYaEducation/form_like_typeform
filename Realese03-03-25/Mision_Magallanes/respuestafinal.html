<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado de la Encuesta</title>
    <link rel="stylesheet" href="respuestafinal.css">
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Magallanes Sostenible" />
    <link rel="manifest" href="favicon/site.webmanifest" />
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <img src="img/logo.png" alt="Logo">
            <h1 id="logo">Magallanes <br><span>Sostenible</span></h1>
        </div>
        <div class="welcome-message">
            <p>Beneficios Pasos Testimonios Nosotros Blog</p>
        </div>
        <div class="menu-icon">
            &#9776;
        </div>
    </nav>

    <div class="split-container">
        <!-- Mensaje final a la derecha -->
        <div class="result-container">
            <p class="titulo">¡Gracias por completar la encuesta!</p>
            <div class="result-content">
                <p>Tu puntaje obtenido es: <span id="puntaje"></span></p>
                <p>Tu clasificación es: <span id="clasificacion"></span></p>
                <p>Nota: <span id="mensaje"></span></p>
            </div>
            <form action="index.html" method="get">
                <input type="submit" value="Volver al Inicio">
            </form>
        </div>
    </div>

    <!-- Extraer los parámetros de la URL y mostrarlos -->
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById("puntaje").textContent = params.get("puntaje") || "No disponible";
        document.getElementById("clasificacion").textContent = params.get("clasificacion") || "No disponible";
        document.getElementById("mensaje").textContent = params.get("mensaje") || "No disponible";
    </script>
    <script src="js/auth.js"></script>

</body>

</html>
