<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Categorías</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h2>Gestión de Categorías</h2>
  <!-- Botón para mostrar formulario de "Nueva Categoría" -->
  <button id="btnNewCategory">Nueva Categoría</button>

  <!-- Tabla para listar categorías (agregamos columna Imagen) -->
  <table border="1" id="categoriesTable">
    <thead>
      <tr>
        <th>Imagen</th>
        <th>ID</th>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <!-- Se llenará con JS -->
    </tbody>
  </table>

  <!-- Formulario oculto para Agregar/Editar -->
  <div id="categoryFormContainer" style="display:none;">
    <h3 id="formTitle">Nueva Categoría</h3>
    <input type="hidden" id="categoryId" value="">
    <label>Nombre:</label>
    <input type="text" id="categoryName">
    <br><br>
    <button id="btnSaveCategory">Guardar</button>
    <button id="btnCancel">Cancelar</button>
  </div>

  <script src="js/categories_panel.js"></script>
  <script src="../../js/auth.js"></script>
</body>
</html>
